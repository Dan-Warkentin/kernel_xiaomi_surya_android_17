name: Build Custom Surya Kernel (Android 17)

on:
  workflow_dispatch:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Build Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison build-essential ccache curl flex \
            libssl-dev libncurses-dev libelf-dev python3 \
            rsync unzip zip lz4 zstd wget \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

      - name: Download Proton Clang
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          test -x "$(pwd)/clang/bin/clang"

      - name: Setup Ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Build Kernel
        shell: bash
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/clang/bin:$PATH"

          # Defconfig-Check mit sauberer Reihenfolge
          if ! make O=out surya_defconfig; then
            if [ -f "arch/arm64/configs/vendor/surya-perf_defconfig" ]; then
              make O=out vendor/surya-perf_defconfig
            elif [ -f "arch/arm64/configs/vendor/surya_defconfig" ]; then
              make O=out vendor/surya_defconfig
            else
              echo "Fehler: Keine gültige defconfig gefunden!"
              exit 1
            fi
          fi

          # Hauptkompilierung mit allen wichtigen LLVM/Clang-Flags
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            LLVM=1 \
            CC=clang \
            LD=ld.lld \
            HOSTCC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Prepare AnyKernel3 Packaging
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          KERNEL_IMAGE=""
          for candidate in out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image; do
            if [ -f "$candidate" ]; then
              KERNEL_IMAGE="$candidate"
              break
            fi
          done

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "Fehler: Kein Kernel-Image gefunden!"
            find out -maxdepth 4 -type f | head -200
            exit 1
          fi

          cp "$KERNEL_IMAGE" AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Surya-OC-Kernel-A17.zip . -x .git\* README.md *placeholder

      - name: Upload Flashable Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surya-OC-Kernel-A17
          path: Surya-OC-Kernel-A17.zip
